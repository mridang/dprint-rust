[package]
name = "dprint-plugin-mago"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "dprint plugin for mago PHP formatter"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow.workspace = true
dprint-core.workspace = true
serde.workspace = true
serde_json.workspace = true
bumpalo = "3.20.2"
mago-formatter = { git = "https://github.com/carthage-software/mago", package = "mago-formatter", tag = "1.9.1" }
mago-database = { git = "https://github.com/carthage-software/mago", package = "mago-database", tag = "1.0.0" }
mago-php-version = { git = "https://github.com/carthage-software/mago", package = "mago-php-version", tag = "1.0.0" }
